name: cashew_selfhosted
description: A self-hosted fork of Cashew, a budget and financial tracking application designed for you. PLACEHOLDER NAME -- rename before distribution.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The single source of truth for this fork's version -- see specs/07-versioning.md.
# The fork restarted numbering at 1.0.0-beta.1; it does NOT continue upstream
# Cashew's 5.x line (the upstream release this was forked from is recorded as
# upstreamBaseVersion in lib/widgets/showChangelog.dart).
#
# The beta counter and the build number move together, and .githooks/pre-commit
# increments both on every commit, so every deployed build is visibly distinct.
# Don't edit this line by hand unless you mean to (the hook stands down when a
# commit already changes it).
#
# In Android, build-name is used as versionName while build-number used as versionCode.
# In iOS, build-name is used as CFBundleShortVersionString -- note that a
# pre-release suffix is not valid there for App Store submission. Irrelevant
# while this fork only ships web and sideloaded APKs.
version: 1.4.4+75

environment:
  sdk: ">= 3.0.0"
  # flutter_sticky_header >=0.8.0 needs 3.32+, and the Dockerfile builds on
  # 3.44 for the iOS 26 Safari autofill fix. Stating it here turns a confusing
  # transitive resolution error into a clear "wrong Flutter version".
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Declared explicitly: this fork's self-hosted auth/sync/backup client
  # (lib/struct/selfHostedClient.dart) and WebDAV client import it directly, so
  # it must not be left to arrive transitively via another package.
  http: ^1.1.0
  simple_animations: ^5.0.2
  sa3_liquid: ^1.0.1
  intl: ^0.20.2
  animations: ^2.0.11
  flutter_sticky_header: ^0.8.0
  sticky_and_expandable_list: ^1.1.3
  fl_chart: ^0.68.0
  # database dependencies
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.3
  path: ^1.9.0
  web_socket_channel: ^2.4.0
  math_expressions: ^2.5.0
  share_plus: ^10.0.0
  universal_html: ^2.2.4
  # >=2.1.0 was the first release whose Android module declares a `namespace`,
  # which AGP 8 requires. ^6.0.0 now, because 2.x pulls
  # flutter_charset_detector_android 2.1.1, which declares `compileSdk 30` --
  # too old for `android:attr/lStar` (API 31), which Flutter 3.44's androidx
  # dependencies pull in. That fails only in `verifyReleaseResources`, a
  # release-only task, so a debug APK built fine while the release one did not.
  # The android module is on compileSdk 35 from 4.0.0. Only
  # CharsetDetector.autoDecode is used, and that call is unchanged throughout.
  flutter_charset_detector: ^6.0.0
  # Was a git dependency on melWiss/flutter_file_picker, a fork carrying a
  # workaround for upstream issue #1404 (on Android 14 a FileType.custom pick
  # returns "user cancelled" immediately -- which is what importCSV.dart does).
  # That fork is stuck at file_picker 6.0.1 and still declares
  # `registerWith(PluginRegistry.Registrar)`, the v1 Android embedding Flutter
  # removed in 3.29, so it cannot compile at all under 3.44.
  #
  # Upstream #1404 is closed, and the cause reported in that thread is
  # `android:launchMode="singleInstance"` on MainActivity, which this app still
  # sets -- so if a CSV import on an Android phone reports a cancelled picker,
  # `singleTop` is the next lever, not another fork.
  #
  # 8.x, not the current 13.x: from 13.3.3 file_picker pulls windows_file_picker,
  # which needs win32 ^6.3.0, while device_info_plus ^10.1.0 caps win32 below 6.
  # 8.x needs neither, so this stays a one-package change. Verified that 8.x
  # carries no `registerWith(PluginRegistry.Registrar)`, which is what made the
  # old fork uncompilable.
  file_picker: ^8.0.7
  auto_size_text: ^3.0.0
  shared_preferences: ^2.2.3
  csv: ^6.0.0
  sliding_sheet:
    path: ./packages/sliding_sheet-0.5.2-modified/
  implicitly_animated_reorderable_list:
    path: ./packages/implicitly_animated_reorderable_list-0.4.2-modified/
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  # flutter_notification_listener: ^1.3.2
  # installed_apps: ^1.3.1
  url_launcher: ^6.2.6
  flutter_launcher_icons: ^0.10.0
  package_info_plus: ^8.0.0
  # mrx_charts: ^0.1.3
  transparent_image: ^2.0.0
  pausable_timer: ^3.1.0+3
  animated_fractionally_sized_box: ^2.0.1
  flutter_local_notifications: ^17.2.1+1
  system_theme: ^3.0.0
  sliver_tools: ^0.2.12
  reorderable_grid_view:
    git:
      url: https://github.com/jameskokoska/reorderable_grid_view
  local_auth: ^2.2.0
  timer_builder: ^2.0.0
  device_info_plus: ^10.1.0
  flutter_lazy_indexed_stack: ^0.0.6 
  app_settings: ^5.1.1
  provider: ^6.1.2
  # 1.0.8 still declares registerWith(PluginRegistry.Registrar), the v1 Android
  # embedding removed in Flutter 3.29, so it cannot compile under 3.44.
  # 5.x returns a TimezoneInfo instead of a nullable String -- see main.dart.
  flutter_timezone: ^5.1.1
  scrollable_positioned_list: ^0.3.8
  # Pinned, not caret: lib/struct/translationOverrides.dart imports
  # easy_localization/src/localization.dart to swap the live translation maps
  # when a string is edited in the in-app editor. That is the package's own
  # mechanism (its delegate calls the same Localization.load), but it is not
  # exported, so an unreviewed minor bump could break it silently.
  easy_localization: 3.0.8
  # simple_shadow: ^0.3.1
  quick_actions: ^1.0.7
  # feature_discovery: ^0.14.1
  gradient_borders: ^1.0.1
  visibility_detector: ^0.4.0+2
  confetti: ^0.7.0
  image_picker: ^1.1.2
  flutter_displaymode: ^0.6.0
  notification_listener_service: ^0.3.3
  home_widget: ^0.9.2
  material_symbols_icons: ^4.2768.0
  app_links: ^6.1.4
  expandable_page_view: ^1.0.17
  flutter_staggered_grid_view: ^0.7.0
  flutter_colorpicker: ^1.1.0
  
# flutter pub run flutter_launcher_icons:main
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon-web.png"
    background_color: "#ffffff"
    theme_color: "#5f85c2"

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.14.0
  build_runner: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  assets:
    - assets/fonts/
    - assets/categories/
    - assets/icon/
    - assets/landing/
    - assets/images/
    - assets/static/
    - assets/icons/fun/
    - assets/translations/generated/
    - assets/static/generated/
    - assets/static/generated/currencies.json
    - assets/static/language-names.json

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

  fonts:
    - family: Avenir
      fonts:
        - asset: assets/fonts/AvenirLTStd-Roman.otf
        - asset: assets/fonts/AvenirLTStd-Black.otf
          weight: 700
    # Inter is the font family fallback
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Not a font we use -- this entry exists purely to stop CanvasKit fetching
    # Roboto from fonts.gstatic.com at every launch, which is the last live
    # Google request in the fork and now hits every client (the web build is
    # pinned to canvaskit, see Dockerfile). The engine's rule is exact and
    # unrelated to how many families we ship: canvaskit/fonts.dart downloads
    # _robotoUrl unless the FontManifest declares a family named literally
    # "Roboto" (`if (family.name == 'Roboto') loadedRoboto = true`). It is only
    # ever a last-resort fallback, used when text asks for a font that isn't
    # registered, so pointing it at Inter -- already this app's declared
    # fallback family, and a near-Roboto grotesque -- keeps the bytes local and
    # the rendering consistent. Removing this re-adds a blocking gstatic
    # request on first paint; verify with the network panel, not by reading.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: Metropolis
      fonts:
        - asset: assets/fonts/Metropolis-Regular.otf
        - asset: assets/fonts/Metropolis-Bold.otf
          weight: 700
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed-Regular.ttf
        - asset: assets/fonts/RobotoCondensed-Bold.ttf
          weight: 700
    - family: Inconsolata
      fonts:
        - asset: assets/fonts/Inconsolata-Regular.ttf
        - asset: assets/fonts/Inconsolata-Bold.ttf
          weight: 700
    - family: Icons
      fonts:
        - asset: assets/icons/Icons.ttf
