// Declarative plugin application, required from Flutter 3.44 -- the old
// imperative form (applying the Android, Kotlin and Flutter plugins by script)
// is now a hard error. The Flutter plugin must come last of the three.
// Versions are declared once, in ../settings.gradle.
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // 36, not 35: app_links, flutter_plugin_android_lifecycle,
    // image_picker_android, local_auth_android and quick_actions_android all
    // require Android SDK 36 under Flutter 3.44. targetSdk stays at 34 --
    // compiling against newer APIs is separate from opting in to new runtime
    // behaviour.
    compileSdk 36
    // AGP 8 reads the application id from here, not from a `package` attribute
    // in AndroidManifest.xml (which it now rejects). Must stay in sync with
    // applicationId below and with the Kotlin package under src/main/kotlin.
    namespace 'com.selfhosted.cashew'

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.selfhosted.cashew"
        // Explicit, not flutter.minSdkVersion: platform views need API 23, and
        // the floor is a device-support decision rather than an SDK default.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    lintOptions {
        disable 'InvalidPackage'
        disable "Instantiatable"
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
      // Flag to enable support for the new language APIs
      coreLibraryDesugaringEnabled true
      // Sets Java compatibility to Java 8
      sourceCompatibility JavaVersion.VERSION_1_8
      targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            // Falls back to the debug key when key.properties isn't present (CI,
            // or a fresh clone before a real signing key exists) so `flutter
            // build apk --release` still produces an installable APK instead of
            // failing at the packaging step with a null storeFile.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'
    implementation 'androidx.window:window:1.0.0'
    implementation 'androidx.window:window-java:1.0.0'
}
