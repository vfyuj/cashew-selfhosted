// AGP and the Kotlin plugin are declared in settings.gradle's `plugins` block
// now, not on a `buildscript` classpath here -- Flutter 3.44 requires the
// declarative form (see the comment in settings.gradle). There is no
// ext.kotlin_version any more either: its only consumer was an explicit
// kotlin-stdlib dependency in app/build.gradle, which KGP 2.x adds by itself.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// system_theme 3.0.0 predates AGP 8 and declares its package only in its
// AndroidManifest.xml, which AGP 8 ignores -- configuration fails without a
// namespace. Upstream added one in 3.2.0, but that pulls system_theme_web
// >=0.0.3, which needs web ^1.0.0.
//
// Upgrading Flutter to 3.44 did NOT unblock this, which the previous comment
// here predicted it would. `web` is still resolved at 0.5.1, now capped by
// drift, sqlite3, share_plus and web_socket_channel (all `web: ^0.5.0`), not
// by the SDK. So system_theme stays at 3.0.0 and this injection stays. Lifting
// it means moving the drift/sqlite3 stack, which is a separate job.
// The value matches the plugin's own manifest package and Kotlin package.
//
// Registered via gradle.beforeProject rather than a subprojects/afterEvaluate
// block because the evaluationDependsOn(':app') below evaluates :app -- and
// with it the plugin projects -- part-way through the subprojects iteration, so
// a hook registered there lands too late for projects already evaluated.
gradle.beforeProject { project ->
    if (project.name == 'system_theme') {
        project.plugins.withId('com.android.library') {
            project.android.namespace = 'com.bruno.system_theme'
        }

        // Same pin, second symptom: system_theme 3.0.0 also declares
        // `compileSdk 30`, which predates `android:attr/lStar` (API 31) -- a
        // resource Flutter 3.44's androidx dependencies reference. It fails only
        // in `verifyReleaseResources`, a release-only task, so a debug APK
        // builds fine while `flutter build apk --release` dies with
        // "AAPT: error: resource android:attr/lStar not found".
        //
        // afterEvaluate, unlike the namespace above: beforeProject fires before
        // the plugin's own build script runs, and that script sets compileSdk 30
        // itself, so an assignment made here would just be overwritten. The
        // namespace escapes that because the plugin never sets one. Registering
        // the callback from inside beforeProject is still early enough to be
        // safe against the evaluationDependsOn(':app') ordering noted below.
        // Keep the value in step with compileSdk in app/build.gradle.
        project.afterEvaluate {
            if (project.extensions.findByName('android') != null) {
                project.android.compileSdk = 36
            }
        }
    }

    // Kotlin defaults its jvmTarget to whatever JDK runs Gradle (17), while
    // AGP leaves Java compilation at 1.8 in modules that don't say otherwise.
    // AGP 8 fails the build when the two disagree; AGP 7 tolerated it, which is
    // why this only surfaced on the upgrade. A single fixed value doesn't work
    // -- plugins disagree, e.g. share_plus compiles Java at 17 and
    // flutter_charset_detector at 1.8 -- so each module's Kotlin follows that
    // same module's Java setting.
    //
    // Matched by capability (`kotlinOptions`) rather than by the KotlinCompile
    // type: with the plugin declared `apply false` in settings.gradle, the
    // class is not guaranteed to be loadable from this script, and a typed
    // withType() would fail to resolve it.
    //
    // Read inside configureEach, not in afterEvaluate: AGP finalizes
    // compileOptions after our afterEvaluate would run, and touching it early
    // fails with "targetCompatibility is not yet finalized". configureEach
    // defers until the task is actually realized, by which point it is set.
    project.tasks.configureEach { task ->
        if (task.hasProperty('kotlinOptions')) {
            def androidExt = project.extensions.findByName('android')
            if (androidExt != null) {
                task.kotlinOptions.jvmTarget =
                    androidExt.compileOptions.targetCompatibility.toString()
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
