# 1536M was inherited from the upstream template and stopped being enough at
# AGP 8: Jetifier rewrites the bytecode of every dependency, and the debug
# Flutter engine jar is large enough that the transform dies with "Java heap
# space". Release builds survived it, so this only showed up in CI, which
# builds debug. Raised rather than dropping android.enableJetifier below --
# turning that off would avoid the transform entirely and is probably safe on
# an all-AndroidX dependency set, but it changes how every dependency is
# processed and is not worth risking in the same change as a release.
org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
