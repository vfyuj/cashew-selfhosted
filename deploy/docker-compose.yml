# Cashew Selfhosted -- deployment template. Pulls a published image; nothing is built locally (use the root docker-compose.yml to build from source instead).
# All data (database, backups, attachments) lives in ./data next to this file. Settings come from .env -- see .env.example.

services:
  app:
    # One container serves both the API and the web UI on the same port.
    image: ghcr.io/vfyuj/cashew-selfhosted:${CASHEW_VERSION:-latest}
    container_name: cashew-selfhosted

    ports:
      # Only the host port is configurable; the container always listens on 8080.
      - "${CASHEW_PORT:-8080}:8080"

    volumes:
      # Bind mount, not a named volume, so the data stays in a folder you can see and back up directly.
      - ${CASHEW_DATA_DIR:-./data}:/data

    environment:
      - PORT=8080
      # Explicit because pre-1.0.0 images default this inside the container, losing the database on the next pull.
      - DATA_DIR=/data
      - TZ=${TZ:-UTC}
      - LOG_REQUESTS=${LOG_REQUESTS:-true}
      # Only set true behind a reverse proxy you control -- this port is otherwise exposed directly, and the header is client-controlled.
      - TRUST_PROXY_HEADER=${TRUST_PROXY_HEADER:-false}

    restart: unless-stopped

    logging:
      # Caps Docker's default unbounded log growth.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      # Catches a hang, which restart:unless-stopped alone does not.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

    # Caps a runaway before it takes down the whole host; the server itself idles far under this.
    mem_limit: 512m
