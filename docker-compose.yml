services:
  app:
    # One container serves both the API and the web UI on the same port (see /Dockerfile).
    build: .
    ports:
      - "8080:8080"
    volumes:
      - server-data:/data
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - LOG_REQUESTS=true
      # Assumes the Nginx Proxy Manager setup in DEPLOYMENT.md; set false if this port is ever exposed directly.
      - TRUST_PROXY_HEADER=true
    restart: unless-stopped

    logging:
      # Caps Docker's default unbounded log growth.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      # Catches a hang, which restart:unless-stopped alone does not.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

    # Caps a runaway before it takes down the whole host; the server itself idles far under this.
    mem_limit: 512m

volumes:
  server-data:
