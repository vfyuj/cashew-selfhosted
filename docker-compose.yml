services:
  # One container: the Dart API and the Flutter web UI, served from the
  # same origin on the same port (see /Dockerfile, server/lib/src/web_handler.dart).
  # See specs/03-stage-1-kill-google.md.
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - server-data:/data
    environment:
      - PORT=8080
      - DATA_DIR=/data
    restart: unless-stopped

volumes:
  server-data:
