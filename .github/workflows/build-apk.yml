name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # Pinned for the same reason as release.yml: AGP 8.7.3 rejects a JDK it
      # doesn't recognise, failing with nothing but the version number as the
      # error ("> 25.0.2"). Relying on the runner's default Java means a change
      # to the runner image breaks the build with a message that explains
      # nothing.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: "stable"
          cache: true
      - run: flutter pub get
      # --debug, not --release, and no longer because release builds are broken
      # — they aren't, since the AGP 8 upgrade (see specs/09-releases.md). This
      # workflow runs on pull requests, including from forks, where the signing
      # secrets are deliberately unavailable; a release build here would fall
      # back to the Android debug key and produce something indistinguishable
      # from this at twice the build time. The signed artifact people actually
      # install comes from release.yml, on a tag.
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: cashew-selfhosted-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
